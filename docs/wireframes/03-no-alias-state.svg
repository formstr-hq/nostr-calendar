<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="700" height="380" fill="#f4f4f3"/>

  <!-- title -->
  <text x="32" y="34" font-size="13" font-weight="700" letter-spacing="0.6" fill="#686865">GUESTS</text>

  <!-- search input -->
  <rect x="32" y="50" width="576" height="46" rx="8" fill="#ffffff" stroke="#d8d8d6"/>
  <text x="48" y="79" font-size="15" fill="#9a9a97">Add guest — npub, name, or email…</text>
  <circle cx="582" cy="73" r="7" fill="none" stroke="#9a9a97" stroke-width="1.6"/>
  <line x1="587" y1="78" x2="592" y2="83" stroke="#9a9a97" stroke-width="1.6" stroke-linecap="round"/>

  <!-- no-alias notice card -->
  <rect x="32" y="112" width="576" height="120" rx="10" fill="#fbf5f2" stroke="#ecd4cb"/>
  <!-- info glyph -->
  <circle cx="64" cy="144" r="13" fill="none" stroke="#b06a55" stroke-width="1.6"/>
  <line x1="64" y1="139" x2="64" y2="140" stroke="#b06a55" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="144" x2="64" y2="151" stroke="#b06a55" stroke-width="2" stroke-linecap="round"/>

  <text x="90" y="140" font-size="14.5" font-weight="700" fill="#0b0b0c">Add a mail address to invite guests by email</text>
  <text x="90" y="162" font-size="12.5" fill="#686865">Email invites are sent from your own mailstr address, tied to the npub you’re signed in</text>
  <text x="90" y="180" font-size="12.5" fill="#686865">with. You need one to include email guests. Your Nostr guests are invited as usual.</text>

  <!-- CTA button -->
  <rect x="90" y="196" width="188" height="34" rx="8" fill="#111111"/>
  <text x="184" y="218" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Get a mailstr address</text>

  <!-- annotation -->
  <rect x="32" y="256" width="576" height="96" rx="10" fill="#ffffff" stroke="#b8b8b5" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="52" y="284" font-size="13" font-weight="700" fill="#111111">Gated state — no manual address</text>
  <text x="52" y="306" font-size="12.5" fill="#686865">Shown when the organizer has an email guest but no mailstr alias for their npub.</text>
  <text x="52" y="324" font-size="12.5" fill="#686865">The From must be an alias the signed-in npub owns — the bridge authorizes on the</text>
  <text x="52" y="342" font-size="12.5" fill="#686865">seal’s key, so a typed address would be rejected. Claiming one is the only path.</text>
</svg>
