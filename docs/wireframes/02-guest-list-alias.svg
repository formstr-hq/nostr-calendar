<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="700" height="560" fill="#f4f4f3"/>

  <!-- title -->
  <text x="32" y="34" font-size="13" font-weight="700" letter-spacing="0.6" fill="#686865">GUESTS</text>

  <!-- search input (placeholder) -->
  <rect x="32" y="50" width="576" height="46" rx="8" fill="#ffffff" stroke="#d8d8d6"/>
  <text x="48" y="79" font-size="15" fill="#9a9a97">Add guest — npub, name, or email…</text>
  <circle cx="582" cy="73" r="7" fill="none" stroke="#9a9a97" stroke-width="1.6"/>
  <line x1="587" y1="78" x2="592" y2="83" stroke="#9a9a97" stroke-width="1.6" stroke-linecap="round"/>

  <!-- send-invites-from alias selector -->
  <rect x="32" y="112" width="576" height="72" rx="10" fill="#faf6ef" stroke="#e8dcc6"/>
  <!-- envelope-send glyph tile -->
  <rect x="48" y="128" width="34" height="34" rx="8" fill="#f0e7d5"/>
  <rect x="56" y="137" width="18" height="14" rx="2.5" fill="none" stroke="#8a7a55" stroke-width="1.5"/>
  <polyline points="56,139 65,146 74,139" fill="none" stroke="#8a7a55" stroke-width="1.5" stroke-linejoin="round"/>

  <text x="94" y="139" font-size="12" font-weight="700" letter-spacing="0.4" fill="#8a7a55">SEND EMAIL INVITES FROM</text>
  <!-- alias select control -->
  <rect x="94" y="148" width="250" height="30" rx="6" fill="#ffffff" stroke="#d8d8d6"/>
  <text x="106" y="168" font-size="14" fill="#0b0b0c">hello@mailstr.app</text>
  <path d="M328 160 l5 5 l5 -5" fill="none" stroke="#686865" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360" y="168" font-size="12" fill="#9a9a97">2 aliases · pick which address guests see</text>

  <!-- guest list heading -->
  <text x="32" y="214" font-size="12" font-weight="600" fill="#9a9a97">3 GUESTS</text>

  <!-- Row A: Nostr, verified -->
  <rect x="32" y="226" width="576" height="56" rx="8" fill="#f0f0ef"/>
  <circle cx="64" cy="254" r="16" fill="#dfe3ea"/>
  <text x="64" y="259" font-size="13" font-weight="600" fill="#5a6472" text-anchor="middle">A</text>
  <text x="92" y="249" font-size="14.5" font-weight="600" fill="#0b0b0c">Alice</text>
  <text x="92" y="267" font-size="12" fill="#686865">alice@nostrplebs.com</text>
  <circle cx="230" cy="263" r="7" fill="#111111"/>
  <path d="M227 263 l2 2 l4 -4" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="560" y="259" font-size="13" fill="#b23b3b" text-anchor="end">Remove</text>

  <!-- Row B: Nostr, key only -->
  <rect x="32" y="290" width="576" height="56" rx="8" fill="#f0f0ef"/>
  <circle cx="64" cy="318" r="16" fill="#e2dfea"/>
  <text x="64" y="323" font-size="13" font-weight="600" fill="#6a5f7a" text-anchor="middle">B</text>
  <text x="92" y="313" font-size="14.5" font-weight="600" fill="#0b0b0c">npub1q9k…4f7z</text>
  <text x="92" y="331" font-size="12" fill="#9a9a97">Nostr guest · invited via gift-wrap</text>
  <text x="560" y="323" font-size="13" fill="#b23b3b" text-anchor="end">Remove</text>

  <!-- Row C: Email guest -->
  <rect x="32" y="354" width="576" height="56" rx="8" fill="#faf6ef" stroke="#e8dcc6"/>
  <rect x="48" y="366" width="32" height="32" rx="8" fill="#f0e7d5"/>
  <rect x="55" y="375" width="18" height="14" rx="2.5" fill="none" stroke="#8a7a55" stroke-width="1.5"/>
  <polyline points="55,377 64,384 73,377" fill="none" stroke="#8a7a55" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="92" y="377" font-size="14.5" font-weight="600" fill="#0b0b0c">friend@gmail.com</text>
  <text x="92" y="395" font-size="12" fill="#9a9a97">Invited by email</text>
  <!-- via email tag -->
  <rect x="228" y="368" width="74" height="20" rx="10" fill="#efe4cd"/>
  <text x="265" y="382" font-size="11" font-weight="600" fill="#8a7a55" text-anchor="middle">via email</text>
  <text x="560" y="387" font-size="13" fill="#b23b3b" text-anchor="end">Remove</text>

  <!-- annotations -->
  <text x="32" y="446" font-size="12.5" fill="#686865">• The “send from” alias picker appears only once an email guest is added; it lists the</text>
  <text x="44" y="464" font-size="12.5" fill="#686865">organizer’s mailstr aliases (from /api/mails/mailbox). Nostr-only events never see it.</text>
  <text x="32" y="488" font-size="12.5" fill="#686865">• Email guests are visually distinct (warm tile, envelope, “via email”) from Nostr guests.</text>
  <text x="32" y="512" font-size="12.5" fill="#686865">• On save: Nostr guests → existing invite path; email guests → seal + wrap → send-wrap endpoint.</text>
</svg>
